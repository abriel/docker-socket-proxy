services:
  proxy:
    image: nginx:latest
    volumes:
      - /run/docker.sock:/run/docker.sock
      - ./server.conf:/etc/nginx/conf.d/server.conf
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./pki/issued/localhost.crt:/etc/nginx/ssl/server.pem
      - ./pki/private/localhost.key:/etc/nginx/ssl/server.key
      - ./htpasswd:/etc/nginx/htpasswd
    ports:
      - 127.0.0.1:2475:2475
